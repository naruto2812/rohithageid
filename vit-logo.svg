<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062b8" />
      <stop offset="100%" stop-color="#003d73" />
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0084f0" />
      <stop offset="100%" stop-color="#004c8c" />
    </linearGradient>
  </defs>
  
  <!-- Stylized VI Monogram -->
  <!-- Left wing / V stroke -->
  <polygon points="12,18 42,18 84,106 62,112 12,18" fill="url(#blueGrad1)" />
  <polygon points="34,18 78,18 96,62 76,70 34,18" fill="url(#blueGrad2)" />
  
  <!-- Right V stroke & I letter -->
  <polygon points="76,18 100,18 126,76 104,80" fill="url(#blueGrad1)" />
  
  <!-- Red dot on 'i' / institute emblem accent -->
  <circle cx="120" cy="56" r="6" fill="#e52323" />
  
  <!-- Modern VI connection flourish -->
  <polygon points="98,90 120,74 126,110 110,110" fill="#00529b" />
  
  <!-- Text Underneath -->
  <text x="80" y="132" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="800" fill="#0066b3" text-anchor="middle" letter-spacing="0.5">VISHWAKARMA</text>
  <text x="80" y="145" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" fill="#0066b3" text-anchor="middle" letter-spacing="1.2">INSTITUTES</text>
  
  <!-- Big Bold VI badge -->
  <text x="126" y="152" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="900" fill="#003e7e" text-anchor="middle">VI</text>
</svg>
